<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061321">
  <meta name="description" content="Monkeytools by Makako Team: herramientas de análisis de IP, dominios y hashes.">
  <title>Monkeytools | Makako Team</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <main class="container">
    <section class="panel" aria-labelledby="site-title">
      <div class="heading">
        <p class="eyebrow"><span class="status-dot"></span> CYBERSECURITY TOOLKIT</p>
        <h1 id="site-title">Monkey<span>tools</span></h1>
        <p class="author">by Makako Team</p>
      </div>
      <p class="intro">Herramientas de análisis e inteligencia de amenazas</p>
      <nav class="tools" aria-label="Herramientas disponibles">
        <a class="tool" href="https://ip.monkeytools.es/" aria-label="Abrir Análisis IP">
          <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 3v18"/><path d="m13 14 2 2 4-4"/></svg></span>
          <span class="tool-copy"><strong>Análisis IP</strong><small>Reputación de direcciones IP</small></span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="tool" href="https://dominio.monkeytools.es/" aria-label="Abrir Análisis Dominios">
          <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 4.5 6 4.5 9s-1.5 6-4.5 9c-3-3-4.5-6-4.5-9S9 6 12 3Z"/></svg></span>
          <span class="tool-copy"><strong>Análisis Dominios</strong><small>Inteligencia y reputación de dominios</small></span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
        <a class="tool" href="https://hash.monkeytools.es/" aria-label="Abrir Hashes">
          <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 6 21M18 3l-3 18M3 9h18M2 15h18"/></svg></span>
          <span class="tool-copy"><strong>Hashes</strong><small>Análisis de indicadores de archivos</small></span>
          <span class="arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
    </section>
    <footer>© <span id="year">2026</span> Monkeytools · Makako Team</footer>
  </main>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
